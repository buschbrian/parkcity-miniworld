<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Park City — Mini World</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root {
    --bg: #0f1722;
    --panel: rgba(15, 23, 34, 0.90);
    --panel-border: rgba(148, 184, 218, 0.22);
    --ink: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --ice: #38bdf8;
    --pine: #22c55e;
    --lift: #f43f5e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; background: var(--bg); transition: filter 0.35s ease; }
  body.twilight #map { filter: brightness(0.84) contrast(1.08) saturate(1.12) hue-rotate(-6deg); }
  .leaflet-container { background: var(--bg); font: inherit; }
  .leaflet-tile { image-rendering: pixelated; }

  #snow-canvas {
    position: absolute; inset: 0; z-index: 450; pointer-events: none;
    opacity: 0.85; transition: opacity 0.3s ease;
  }
  body.no-snow #snow-canvas { opacity: 0; }

  #panel {
    position: absolute; top: 14px; left: 14px; z-index: 1000;
    width: 276px; max-height: calc(100% - 48px);
    display: flex; flex-direction: column;
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }
  .panel-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--panel-border); }
  .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ice); margin-bottom: 2px;
  }
  .panel-head h1 { font-size: 16px; font-weight: 700; margin: 0 0 3px; letter-spacing: -0.01em; }
  .panel-head p { margin: 0; color: var(--muted); font-size: 12px; }

  .toggles {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 10px 14px; border-bottom: 1px solid var(--panel-border);
  }
  .tog {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 8px; border-radius: 7px; font: 600 11.5px/1 inherit;
    border: 1px solid var(--panel-border); background: rgba(255,255,255,0.04);
    color: var(--muted); cursor: pointer; transition: all 0.15s ease;
  }
  .tog.on { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.55); color: var(--ink); }
  .tog.warm.on { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.6); color: #fde68a; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 9px 14px; border-bottom: 1px solid var(--panel-border);
  }
  .chip {
    padding: 4px 8px; border-radius: 999px; font: 600 11px/1 inherit;
    border: 1px solid var(--panel-border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.15s ease;
  }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  #places { overflow-y: auto; padding: 8px; flex: 1; }
  .place-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: 0; color: var(--ink);
    padding: 7px 8px; border-radius: 8px; font: inherit; cursor: pointer;
    transition: background 0.12s ease;
  }
  .place-btn:hover, .place-btn:focus-visible { background: rgba(255, 255, 255, 0.08); outline: none; }
  .place-btn.off { opacity: 0.5; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; }
  .place-meta { font-size: 11px; color: var(--muted); display: block; }

  .pin {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #0f1722; box-shadow: 0 0 0 2px rgba(255,255,255,0.45), 0 2px 6px rgba(0,0,0,0.5);
  }
  .cabin {
    width: 8px; height: 8px; border-radius: 2px; background: #fbbf24;
    border: 1.5px solid #0f1722; box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
  }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--ink); border: 1px solid var(--panel-border);
  }
  .leaflet-popup-content { margin: 10px 12px; font-size: 12.5px; line-height: 1.45; }
  .leaflet-popup-content .pop-cat {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ice); margin-bottom: 2px;
  }
  .leaflet-popup-content b { font-size: 13.5px; color: #fff; }
  .leaflet-control-attribution { background: rgba(15, 23, 34, 0.85) !important; color: var(--muted) !important; font-size: 11px !important; }
  .leaflet-control-attribution a { color: var(--ink) !important; }

  @media (max-width: 640px) {
    #panel { width: auto; right: 14px; max-height: 44%; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Winter painted mini-world map of Park City, Utah"></div>
<canvas id="snow-canvas"></canvas>

<aside id="panel">
  <div class="panel-head">
    <div class="eyebrow">Winter Visitor Edition</div>
    <h1>Tiny Park City</h1>
    <p id="status">Loading winter tiles…</p>
  </div>
  <div class="toggles">
    <button id="btn-snow" class="tog on" type="button">Snowfall</button>
    <button id="btn-ski" class="tog on" type="button">Runs &amp; Lifts</button>
    <button id="btn-twilight" class="tog warm" type="button">Apres Twilight</button>
    <button id="btn-source" class="tog" type="button">Summer 3D</button>
  </div>
  <div class="filters" id="filters"></div>
  <nav id="places" aria-label="Park City winter landmarks"></nav>
</aside>

<script src="vendor/leaflet.js"></script>
<script>
const CAT = {
  lift:     { label: 'Lifts',     color: '#f43f5e' },
  ski:      { label: 'Ski Runs',  color: '#38bdf8' },
  dining:   { label: 'Apres',     color: '#f59e0b' },
  landmark: { label: 'Main St',   color: '#a78bfa' },
  transit:  { label: 'Transit',   color: '#22c55e' },
};
const DIFF_COLOR = { novice: '#22c55e', intermediate: '#38bdf8', advanced: '#e2e8f0', expert: '#f8fafc' };

// Gentle snowfall overlay
(() => {
  const cv = document.getElementById('snow-canvas');
  const ctx = cv.getContext('2d');
  let w = 0, h = 0;
  const flakes = Array.from({ length: 110 }, () => ({
    x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.1,
    vy: 0.35 + Math.random() * 0.75, vx: (Math.random() - 0.5) * 0.35, phase: Math.random() * 6.28
  }));
  const resize = () => { w = cv.width = window.innerWidth; h = cv.height = window.innerHeight; };
  resize();
  window.addEventListener('resize', resize);
  let t = 0;
  function tick() {
    if (!document.body.classList.contains('no-snow')) {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(241, 245, 249, 0.85)';
      t += 0.015;
      for (const f of flakes) {
        f.y += f.vy / Math.max(h, 400);
        f.x += (f.vx + Math.sin(t + f.phase) * 0.25) / Math.max(w, 400);
        if (f.y > 1) { f.y = -0.02; f.x = Math.random(); }
        if (f.x < 0) f.x += 1; else if (f.x > 1) f.x -= 1;
        ctx.beginPath();
        ctx.arc(f.x * w, f.y * h, f.r, 0, 6.283);
        ctx.fill();
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

(async () => {
  const cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
  const layers = cfg.layers;
  const detailKey = layers.detail ? 'detail' : (layers.detail_render ? 'detail_render' : null);
  const renderKey = layers.detail_render ? 'detail_render' : null;
  const overKey = layers.overview ? 'overview' : (layers.overview_render ? 'overview_render' : null);
  const DZ = detailKey ? layers[detailKey].native_zoom : 8;

  const map = L.map('map', {
    crs: L.CRS.Simple, minZoom: 4, maxZoom: DZ + 1, zoomSnap: 0.5, attributionControl: true, zoomControl: false
  });
  L.control.zoom({ position: 'topright' }).addTo(map);

  const toLL = (x, y, z) => map.unproject([x, y], z);
  const boundsOf = (l) => L.latLngBounds(
    toLL(l.bounds_px[0], l.bounds_px[3], l.native_zoom),
    toLL(l.bounds_px[2], l.bounds_px[1], l.native_zoom)
  );
  // Tiles fill unpainted areas with stitch.py's BG (24, 26, 31); key it out so the layer below shows through.
  const Keyed = L.TileLayer.extend({
    createTile(coords, done) {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const img = new Image();
      img.onload = () => {
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, 256, 256), a = d.data;
        for (let i = 0; i < a.length; i += 4)
          if (Math.abs(a[i] - 24) + Math.abs(a[i + 1] - 26) + Math.abs(a[i + 2] - 31) < 18) a[i + 3] = 0;
        g.putImageData(d, 0, 0);
        done(null, c);
      };
      img.onerror = (e) => done(e, c);
      img.crossOrigin = 'anonymous';
      img.src = this.getTileUrl(coords);
      return c;
    },
  });
  const makeTile = (l, opts = {}, keyed = false) => new (keyed ? Keyed : L.TileLayer)(l.path, {
    minNativeZoom: l.min_zoom, maxNativeZoom: l.native_zoom, bounds: boundsOf(l),
    tileSize: 256, noWrap: true, keepBuffer: 4, attribution: cfg.attribution, ...opts
  });

  if (overKey) makeTile(layers[overKey], { minZoom: 4, maxZoom: DZ + 1, zIndex: 1 }).addTo(map);
  const rawLayer = renderKey && renderKey !== detailKey ? makeTile(layers[renderKey], { minZoom: 4, maxZoom: DZ + 1, zIndex: 2 }, !!overKey).addTo(map) : null;
  const paintedLayer = detailKey ? makeTile(layers[detailKey], { minZoom: 4, maxZoom: DZ + 1, zIndex: 3 }, !!(rawLayer || overKey)).addTo(map) : null;

  const main = layers[detailKey || overKey];
  map.fitBounds(boundsOf(main), { padding: [24, 24] });

  document.getElementById('status').textContent =
    `${layers[detailKey || overKey].frames} painted winter squares · Historic Main St & Old Town`;

  // Ski runs + animated chairlifts overlay
  const skiGroup = L.layerGroup().addTo(map);
  const liftTracks = [];
  if (cfg.ski) {
    const sz = cfg.ski.zoom;
    for (const run of cfg.ski.runs || []) {
      const pts = run.px.map(([x, y]) => toLL(x, y, sz));
      L.polyline(pts, {
        color: DIFF_COLOR[run.difficulty] || '#38bdf8',
        weight: 4, opacity: 0.8, dashArray: '8 6', lineCap: 'round'
      }).bindTooltip(`${run.name} (${run.difficulty})`, { sticky: true }).addTo(skiGroup);
    }
    const cabinIcon = L.divIcon({ className: '', html: '<div class="cabin"></div>', iconSize: [8, 8], iconAnchor: [4, 4] });
    for (const lift of cfg.ski.lifts || []) {
      const pts = lift.px.map(([x, y]) => toLL(x, y, sz));
      L.polyline(pts, { color: '#f43f5e', weight: 2.5, opacity: 0.9 }).bindTooltip(lift.name, { sticky: true }).addTo(skiGroup);
      const cabins = [0, 0.25, 0.5, 0.75].map((phase) => ({
        phase, marker: L.marker(pts[0], { icon: cabinIcon, interactive: false }).addTo(skiGroup)
      }));
      liftTracks.push({ pts, cabins });
    }
  }

  // Animate chairlift cabins smoothly along lift polylines
  let liftT = 0;
  function animateLifts() {
    liftT = (liftT + 0.0012) % 1;
    for (const tr of liftTracks) {
      const n = tr.pts.length - 1;
      for (const c of tr.cabins) {
        const u = (liftT + c.phase) % 1;
        const seg = Math.min(n - 1, Math.floor(u * n));
        const f = u * n - seg;
        const a = tr.pts[seg], b = tr.pts[seg + 1];
        c.marker.setLatLng([a.lat + (b.lat - a.lat) * f, a.lng + (b.lng - a.lng) * f]);
      }
    }
    requestAnimationFrame(animateLifts);
  }
  if (liftTracks.length) animateLifts();

  // Landmarks + category filters
  const nav = document.getElementById('places');
  const filterBar = document.getElementById('filters');
  const inside = (p) => {
    const l = layers[detailKey || overKey];
    const s = 2 ** (l.native_zoom - p.px[2]);
    return p.px[0] * s >= l.bounds_px[0] && p.px[0] * s <= l.bounds_px[2] &&
           p.px[1] * s >= l.bounds_px[1] && p.px[1] * s <= l.bounds_px[3];
  };

  let activeCat = 'all';
  const entries = [];
  for (const p of cfg.places || []) {
    const cat = CAT[p.category] || CAT.landmark;
    const ll = toLL(p.px[0], p.px[1], p.px[2]);
    const covered = inside(p);
    const icon = L.divIcon({
      className: '',
      html: `<div class="pin" style="background:${cat.color}"></div>`,
      iconSize: [14, 14], iconAnchor: [7, 7]
    });
    const m = L.marker(ll, { icon, title: p.name, keyboard: true }).addTo(map)
      .bindPopup(`<div class="pop-cat">${cat.label}</div><b>${p.name}</b><br>${p.blurb}`);
    const b = document.createElement('button');
    b.className = 'place-btn' + (covered ? '' : ' off');
    b.innerHTML = `<span class="dot" style="background:${cat.color}"></span><span>${p.name}<span class="place-meta">${cat.label}${covered ? '' : ' · outside 3x3 core'}</span></span>`;
    b.addEventListener('click', () => { map.flyTo(ll, DZ - 0.5, { duration: 0.7 }); m.openPopup(); });
    nav.appendChild(b);
    entries.push({ p, m, b });
  }

  const renderFilter = () => {
    for (const e of entries) {
      const show = activeCat === 'all' || e.p.category === activeCat;
      e.b.style.display = show ? 'flex' : 'none';
      if (show) e.m.addTo(map); else e.m.remove();
    }
  };
  const cats = [['all', 'All'], ...Object.entries(CAT).map(([k, v]) => [k, v.label])];
  for (const [key, label] of cats) {
    const chip = document.createElement('button');
    chip.className = 'chip' + (key === 'all' ? ' active' : '');
    chip.textContent = label;
    chip.addEventListener('click', () => {
      activeCat = key;
      filterBar.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === chip));
      renderFilter();
    });
    filterBar.appendChild(chip);
  }

  // Top toggles
  const btnSnow = document.getElementById('btn-snow');
  btnSnow.addEventListener('click', () => {
    btnSnow.classList.toggle('on');
    document.body.classList.toggle('no-snow', !btnSnow.classList.contains('on'));
  });
  const btnSki = document.getElementById('btn-ski');
  btnSki.addEventListener('click', () => {
    btnSki.classList.toggle('on');
    if (btnSki.classList.contains('on')) skiGroup.addTo(map); else skiGroup.remove();
  });
  const btnTw = document.getElementById('btn-twilight');
  btnTw.addEventListener('click', () => {
    btnTw.classList.toggle('on');
    document.body.classList.toggle('twilight', btnTw.classList.contains('on'));
  });
  const btnSrc = document.getElementById('btn-source');
  if (!rawLayer) {
    btnSrc.style.opacity = '0.4';
    btnSrc.title = 'Run stitch.py --source renders to enable Summer 3D toggle';
  } else {
    btnSrc.addEventListener('click', () => {
      btnSrc.classList.toggle('on');
      if (btnSrc.classList.contains('on')) { paintedLayer.remove(); }
      else { paintedLayer.addTo(map); }
    });
  }
})();
</script>
</body>
</html>
